<!DOCTYPE html>

<html class="dark scroll-smooth" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paweł Szostak — Personal Portfolio &amp; AI Assistant</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#a855f7',
              pink: '#ec4899',
            }
          },
          boxShadow: {
            'subtle-card': '0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08)',
            'pill-active': '0 2px 10px rgba(168, 85, 247, 0.25)',
            'avatar-glow': '0 0 50px -10px rgba(168, 85, 247, 0.4)'
          }
        }
      }
    };
  </script>
<!-- Background Pattern and Ambient Glow Styles -->
<style data-purpose="background-styles">
    /* Deep dark background with subtle violet dot grid pattern */
    .bg-dot-pattern-dark {
      background-color: #0d0a1a;
      background-image: radial-gradient(rgba(147, 130, 180, 0.22) 1.25px, transparent 1.25px);
      background-size: 26px 26px;
    }

    /* Ambient central glow for soft lighting focus behind avatar & card */
    .ambient-radial-glow-dark {
      background: radial-gradient(circle at 50% 32%, rgba(147, 51, 234, 0.18) 0%, rgba(219, 39, 119, 0.12) 28%, rgba(13, 10, 26, 0) 70%);
    }

    /* Name Gradients matching refined violet to pink theme */
    .gradient-name-first {
      background: linear-gradient(135deg, #a78bfa 0%, #c084fc 60%, #d8b4fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-name-last {
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen bg-dot-pattern-dark text-slate-100 antialiased relative selection:bg-purple-900/60 selection:text-purple-200 overflow-x-hidden flex flex-col justify-between">
<!-- Ambient background glow layer -->
<div aria-hidden="true" class="pointer-events-none fixed inset-0 ambient-radial-glow-dark z-0"></div>
<!-- BEGIN: MainHeader -->
<header class="relative z-20 w-full px-6 lg:px-12 pt-7 pb-4 max-w-7xl mx-auto flex items-center justify-between">
<!-- Left: Theme toggle icon button -->
<div class="flex items-center" data-purpose="theme-toggle-container">
<button aria-label="Toggle theme mode" class="w-11 h-11 rounded-full bg-white/[0.05] border border-white/10 shadow-lg flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/[0.09] transition-all duration-200 active:scale-95 backdrop-blur-md" data-purpose="theme-toggle-button" id="theme-toggle-btn" type="button">
<!-- Sun Icon (showing active dark mode toggled) -->
<svg class="w-5 h-5 text-amber-300/90" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Center: Floating Pill Navigation Bar -->
<nav class="hidden md:flex items-center p-1.5 rounded-full bg-white/[0.04] border border-white/10 shadow-xl backdrop-blur-xl" data-purpose="top-navigation">
<a class="px-5 py-2 rounded-full text-xs font-medium tracking-wide bg-[#241a3e] text-white border border-purple-500/30 shadow-pill-active transition-all duration-150" data-purpose="nav-link-home" href="#home">
        Home
      </a>
<a class="px-5 py-2 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/[0.07] transition-all duration-150" data-purpose="nav-link-about" href="#about">
        About
      </a>
<a class="px-5 py-2 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/[0.07] transition-all duration-150" data-purpose="nav-link-projects" href="#projects">
        Projects
      </a>
<a class="px-5 py-2 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/[0.07] transition-all duration-150" data-purpose="nav-link-skills" href="#skills">
        Skills
      </a>
<a class="px-5 py-2 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/[0.07] transition-all duration-150" data-purpose="nav-link-other" href="#other">
        Other
      </a>
</nav>
<!-- Right: Book a Call action button -->
<div class="flex items-center" data-purpose="header-cta">
<a class="inline-flex items-center gap-2.5 px-4 sm:px-5 py-2.5 rounded-full bg-white/[0.05] border border-white/10 hover:border-purple-500/40 text-xs sm:text-sm font-medium text-slate-200 hover:text-white shadow-lg hover:bg-white/[0.09] transition-all duration-200 active:scale-98 backdrop-blur-md" data-purpose="book-call-button" href="#book-call">
<!-- Calendar Icon -->
<svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Book a Call</span>
</a>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: HeroAndInteractiveChat -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-start pt-4 pb-12 px-4 sm:px-6 w-full max-w-5xl mx-auto">
<!-- Hero Avatar Section -->
<section class="flex flex-col items-center text-center mt-2 mb-8" data-purpose="hero-identity">
<!-- Interactive 3D Apple Memoji Scene Container with glowing aura -->
<div class="relative w-full max-w-sm mx-auto flex items-center justify-center mb-3">
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-purple-600/35 via-pink-600/25 to-indigo-500/30 blur-2xl pointer-events-none scale-125"></div>
<div class="relative z-10 w-44 h-44 sm:w-48 sm:h-48 mx-auto rounded-full overflow-hidden shadow-2xl border border-white/20 bg-gradient-to-b from-white/15 to-white/5 backdrop-blur-md transition-transform duration-200 hover:scale-105 ring-1 ring-purple-400/20">
<img alt="Paweł Szostak 3D Memoji Avatar" class="w-full h-full object-cover object-center select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1WLN1a4ZmSv66vJfA0O4Vec8PJ8SsmoM6wR28-qGRwDb-Y1RbcKaEAj_-pV-qo8znzI18D05nUQS-aAAMrPV8wX7A34wB6smWr1O2iR5kf10lxwL1ROWUvgvthUOKWGe95FUDctvld-4xC9kg6q_scSOfIgY6OyJNrdSOkUyySmbssmq7PvSOt7dfqeLNCZ8vpywD_kjZx7TCZo9dsKleWPOuEs8VhcJLrfaAO7hyzT_bgZsfM7E0jQ52I"/>
</div>
</div>
<!-- Hero Headline with dual-color gradients -->
<h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white flex items-center justify-center flex-wrap gap-2">
<span class="text-slate-100">Hi, I'm</span>
<span class="gradient-name-first">Paweł</span>
<span class="gradient-name-last">Szostak</span>
</h1>
</section>
<!-- AI Interactive Chat Console Card in Dark Glassmorphism -->
<section class="w-full max-w-3xl" data-purpose="interactive-chat-card">
<div class="relative w-full rounded-3xl bg-[#161126]/80 backdrop-blur-2xl border border-white/10 shadow-2xl overflow-hidden flex flex-col min-h-[380px] sm:min-h-[420px] transition-all ring-1 ring-white/5">
<!-- Subtle radial spotlight inside the dark card -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top,_rgba(168,85,247,0.12),transparent_60%)]"></div>
<!-- Center Stage: Muted prompt text -->
<div class="relative z-10 flex-1 flex items-center justify-center p-8 select-none">
<p class="text-base sm:text-lg md:text-xl font-normal text-slate-400 tracking-wide text-center" id="chat-center-status">
            Ask me anything about Paweł...
          </p>
</div>
<!-- Card Bottom Section: Query Pills & Input Container -->
<div class="relative z-10 p-4 sm:p-6 pt-0 flex flex-col gap-4">
<!-- Quick query filter pills row -->
<div class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5" data-purpose="quick-queries">
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 hover:text-white border border-white/10 hover:border-purple-400/40 shadow-sm transition-all duration-150 active:scale-95 backdrop-blur-sm" data-purpose="pill-chip" onclick="setPrompt('Tell me about your recent work')" type="button">
              Work
            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 hover:text-white border border-white/10 hover:border-purple-400/40 shadow-sm transition-all duration-150 active:scale-95 backdrop-blur-sm" data-purpose="pill-chip" onclick="setPrompt('Who is Paweł and what is his background?')" type="button">
              About me
            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 hover:text-white border border-white/10 hover:border-purple-400/40 shadow-sm transition-all duration-150 active:scale-95 backdrop-blur-sm" data-purpose="pill-chip" onclick="setPrompt('What technologies and skills do you excel at?')" type="button">
              Skills
            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 hover:text-white border border-white/10 hover:border-purple-400/40 shadow-sm transition-all duration-150 active:scale-95 backdrop-blur-sm" data-purpose="pill-chip" onclick="setPrompt('How can I contact Paweł or schedule a meeting?')" type="button">
              Contact
            </button>
</div>
<!-- Bottom Full-Width Rounded Pill Search/Chat Input -->
<form class="relative flex items-center w-full" data-purpose="chat-input-form" id="chat-input-form" onsubmit="handleInputSubmit(event)">
<div class="relative w-full">
<input class="w-full pl-5 pr-12 py-3.5 sm:py-4 rounded-full bg-black/40 hover:bg-black/50 focus:bg-black/60 text-sm sm:text-base text-slate-100 placeholder-slate-500 border border-white/10 focus:border-purple-400/80 focus:ring-2 focus:ring-purple-500/20 shadow-inner outline-none transition-all duration-200" id="user-chat-input" oninput="handleInputTyping()" placeholder="Ask anything about Paweł..." type="text"/>
<!-- Submit arrow button placed inside the pill input -->
<button aria-label="Send query" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/10 hover:bg-purple-600 text-slate-200 hover:text-white flex items-center justify-center transition-all duration-200 active:scale-90" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
</div>
</div>
</section>
</main>
<!-- END: HeroAndInteractiveChat -->
<!-- BEGIN: MinimalFooter -->
<footer class="relative z-10 w-full py-6 text-center text-xs text-slate-500">
<p class="">© 2026 Paweł Szostak. Crafted with precision &amp; clarity.</p>
</footer>
<!-- END: MinimalFooter -->
<!-- Interactive script for quick pills and typing action -->
<script data-purpose="chat-interactions">
    let typingTimer = null;

    function handleInputTyping() {
      if (typeof window.triggerAiSpeech === 'function') {
        window.triggerAiSpeech(1200);
      }
    }

    function setPrompt(text) {
      const input = document.getElementById('user-chat-input');
      const status = document.getElementById('chat-center-status');
      if (input) {
        input.value = text;
        input.focus();
      }
      if (status) {
        status.textContent = `"${text}"`;
        status.classList.remove('text-slate-400');
        status.classList.add('text-purple-300', 'font-medium');
      }
      if (typeof window.triggerAiSpeech === 'function') {
        window.triggerAiSpeech(4000);
      }
    }

    function handleInputSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('user-chat-input');
      const status = document.getElementById('chat-center-status');
      if (input && input.value.trim() !== '') {
        const queryText = input.value.trim();
        if (status) {
          status.textContent = `Thinking about: "${queryText}"...`;
          status.classList.remove('text-slate-400');
          status.classList.add('text-purple-400', 'font-medium');
        }
        if (typeof window.triggerAiSpeech === 'function') {
          window.triggerAiSpeech(5000);
        }
        input.value = '';
      }
    }
  </script>
</body></html>
