<!-- Background Pattern and Ambient Glow Styles -->
<style data-purpose="background-styles">

<!-- Hero Headline with dual-color gradients -->
<h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 flex items-center justify-center flex-wrap gap-2">
<span class="">Hi, I'm</span>
<span class="gradient-name-first">Paweł</span>
<span class="gradient-name-last">Szostak</span>

<!-- AI Interactive Chat Console Card (1:1 direct replica converted to crisp white mode) -->
<section class="w-full max-w-3xl" data-purpose="interactive-chat-card">
<div class="relative w-full rounded-3xl bg-white/90 backdrop-blur-xl border border-slate-200/80 shadow-subtle-card overflow-hidden flex flex-col min-h-[380px] sm:min-h-[420px] transition-all">
<!-- Center Stage: Muted prompt text -->
<div class="flex-1 flex items-center justify-center p-8 select-none">
<p class="text-base sm:text-lg md:text-xl font-normal text-slate-400 tracking-wide text-center" id="chat-center-status">
            Ask me anything about Paweł...
          </p>
</div>
<!-- Card Bottom Section: Query Pills & Input Container -->
<div class="p-4 sm:p-6 pt-0 flex flex-col gap-4">
<!-- Quick query filter pills row -->
<div class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5" data-purpose="quick-queries">
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-slate-100/90 text-slate-600 hover:text-slate-900 hover:bg-slate-200/80 border border-slate-200/50 shadow-xs transition-colors duration-150 active:scale-95" data-purpose="pill-chip" onclick="setPrompt('Tell me about your recent work')" type="button">
              Work
            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-slate-100/90 text-slate-600 hover:text-slate-900 hover:bg-slate-200/80 border border-slate-200/50 shadow-xs transition-colors duration-150 active:scale-95" data-purpose="pill-chip" onclick="setPrompt('Who is Paweł and what is his background?')" type="button">

            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-slate-100/90 text-slate-600 hover:text-slate-900 hover:bg-slate-200/80 border border-slate-200/50 shadow-xs transition-colors duration-150 active:scale-95" data-purpose="pill-chip" onclick="setPrompt('What technologies and skills do you excel at?')" type="button">
              Skills
            </button>
<button class="px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-slate-100/90 text-slate-600 hover:text-slate-900 hover:bg-slate-200/80 border border-slate-200/50 shadow-xs transition-colors duration-150 active:scale-95" data-purpose="pill-chip" onclick="setPrompt('How can I contact Paweł or schedule a meeting?')" type="button">
              Contact
            </button>
</div>
<!-- Bottom Full-Width Rounded Pill Search/Chat Input -->
<form class="relative flex items-center w-full" data-purpose="chat-input-form" id="chat-input-form" onsubmit="handleInputSubmit(event)">
<div class="relative w-full">
<input class="w-full pl-5 pr-12 py-3.5 sm:py-4 rounded-full bg-slate-50/80 hover:bg-slate-50 focus:bg-white text-sm sm:text-base text-slate-800 placeholder-slate-400 border border-slate-200/80 focus:border-purple-400 focus:ring-2 focus:ring-purple-100 shadow-inner outline-none transition-all duration-200" id="user-chat-input" oninput="handleInputTyping()" placeholder="Ask anything about Paweł..." type="text">
<!-- Subtle submit arrow button placed inside the pill input -->
<button aria-label="Send query" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-200/70 hover:bg-slate-900 text-slate-600 hover:text-white flex items-center justify-center transition-all duration-200 active:scale-90" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

</div>
</form>
</div>
</div>

<!-- Interactive script for quick pills and typing action -->
<script data-purpose="chat-interactions">
    let typingTimer = null;

    function handleInputTyping() {
      if (typeof window.triggerAiSpeech === 'function') {
        window.triggerAiSpeech(1200);
      }
    }

    function setPrompt(text) {
      const input = document.getElementById('user-chat-input');
      const status = document.getElementById('chat-center-status');
      if (input) {
        input.value = text;
        input.focus();
      }
      if (status) {
        status.textContent = `"${text}"`;
        status.classList.remove('text-slate-400');
        status.classList.add('text-slate-700', 'font-medium');
      }
      if (typeof window.triggerAiSpeech === 'function') {
        window.triggerAiSpeech(4000);
      }
    }

    function handleInputSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('user-chat-input');
      const status = document.getElementById('chat-center-status');
      if (input && input.value.trim() !== '') {
        const queryText = input.value.trim();
        if (status) {
          status.textContent = `Thinking about: "${queryText}"...`;
          status.classList.remove('text-slate-400');
          status.classList.add('text-purple-600', 'font-medium');
        }
        if (typeof window.triggerAiSpeech === 'function') {
          window.triggerAiSpeech(5000);
        }
        input.value = '';
      }
    }
  </script>
